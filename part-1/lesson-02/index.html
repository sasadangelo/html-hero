<!DOCTYPE html> <!-- Declares the document type: HTML5 -->
<html lang="en"> <!-- Start of the HTML document, with language set to English -->

<head>
    <title>HTML Hero</title> <!-- Page title, visible in the browser tab -->
    <!--
        Specifies the character encoding of the document.
        "UTF-8" is a universal encoding that supports most characters from world languages,
        including accents, special symbols, and emojis. It's essential to avoid display issues
        with multilingual texts.
    -->
    <meta charset="UTF-8">
</head>

<body>
    <!-- Visible page content -->

    <!--
        HTML headings (from <h1> to <h6>) represent titles of different levels.
        <h1> is the main title, <h2> is a subtitle, and so on up to <h6>.
        It's good practice to use only one <h1> per page.
    -->
    <h1>Level 1 Heading</h1>
    <h2>Level 2 Heading</h2>
    <h3>Level 3 Heading</h3>
    <h4>Level 4 Heading</h4>
    <h5>Level 5 Heading</h5>
    <h6>Level 6 Heading</h6>
    Hello World!
</body>

</html>
