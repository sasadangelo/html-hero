<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Hero – Gallery</title>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="assets/css/default.css">
    <link rel="stylesheet" type="text/css" href="assets/css/page.css">
    <link rel="stylesheet" type="text/css" href="assets/css/brands.css">
    <link rel="stylesheet" type="text/css" href="assets/css/fontawesome.css">
    <!--
        The JavaScript for the gallery is in a separate external file.
        Separating HTML, CSS and JavaScript into distinct files is a best practice:
        - the code is more readable and organised
        - the same JS file can be reused by multiple HTML pages
        - the browser can cache the file, improving performance

        The "defer" attribute ensures the script runs only after the DOM
        has been fully loaded, preventing errors.
    -->
    <script type="text/javascript" src="assets/js/gallery.js" defer></script>
</head>

<body>
    <div id="page">
        <header>
            <div id="header-group">
                <div id="logo">
                    <img src="assets/img/code4projects-logo-mini.webp" alt="Code4Projects Logo" width="150"
                        height="150">
                </div>
                <div id="social-media-group">
                    <div class="social-media-title">Follow me on:</div>
                    <div class="social-media-icons">
                        <a aria-label="Code4Projects Facebook page" title="Code4Projects Facebook page"
                            class="social-media-icon social-media-icon-facebook"
                            href="https://www.facebook.com/code4projects/">
                            <span class="fa-brands fa-facebook-f"></span>
                        </a>
                        <a aria-label="Code4Projects Twitter page" title="Code4Projects Twitter page"
                            class="social-media-icon social-media-icon-twitter"
                            href="https://twitter.com/code4projects">
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                        <a aria-label="Code4Projects Linkedin page" title="Code4Projects Linkedin page"
                            class="social-media-icon social-media-icon-linkedin"
                            href="https://www.linkedin.com/in/salvatore-d-angelo-0321851/">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                        <a aria-label="Code4Projects Youtube channel" title="Code4Projects Youtube channel"
                            class="social-media-icon social-media-icon-youtube"
                            href="https://www.youtube.com/channel/UCBntvkFS3phHOFAWNS8_4pg/">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                        <a aria-label="Code4Projects Github page" title="Code4Projects Github page"
                            class="social-media-icon social-media-icon-github" href="https://github.com/sasadangelo">
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </div>
                </div>
            </div>
        </header>
        <div id="navigation">
            <!-- Hamburger icon for mobile menu -->
            <input class="drop-menu-checkbox" type="checkbox" id="drop-menu-checkbox">
            <label class="hamburger" for="drop-menu-checkbox">
                <span class="hamburger-line"></span>
            </label>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about-me.html">About Me</a></li>
                    <li><a href="start-here.html">New User? Start Here</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <!--
                        NEW IN LESSON 24: added the Gallery link to the navigation menu.
                    -->
                    <li><a href="gallery.html">Gallery</a></li>
                </ul>
            </nav>
        </div>
        <main class="page-main">
            <div id="page-container">
                <!--
                    NEW IN LESSON 24: this is the new "Gallery" page.

                    A photo gallery organises images in a grid layout.
                    The CSS in the .gallery-grid class uses:
                    - display: grid  – activates grid layout
                    - grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))
                      automatically creates as many columns as fit, each at least 150px wide
                    - gap: the space between grid cells

                    Clicking on an image opens a full-screen viewer.
                    The logic is handled by the external JavaScript file assets/js/gallery.js,
                    included in the <head> with the defer attribute.
                -->
                <h1>My Gallery</h1>
                <p>
                    A collection of photos that represent me. Click on an image to enlarge it.
                </p>

                <!-- Image grid -->
                <div class="gallery-grid">
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery1.jpeg" alt="Photo 1" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery2.jpeg" alt="Photo 2" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery3.jpeg" alt="Photo 3" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery4.jpeg" alt="Photo 4" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery5.jpeg" alt="Photo 5" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery6.jpeg" alt="Photo 6" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery7.jpeg" alt="Photo 7" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery8.jpeg" alt="Photo 8" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery9.jpeg" alt="Photo 9" onclick="showImage(this);">
                    </div>
                    <div class="gallery-cell">
                        <img src="assets/gallery/gallery10.jpeg" alt="Photo 10" onclick="showImage(this);">
                    </div>
                </div>

                <!--
                    Full-screen viewer.
                    Initially hidden (display: none in CSS).
                    Shown by JavaScript when a photo is clicked.
                    The × button closes the viewer.
                -->
                <div id="gallery-viewer">
                    <span id="gallery-close" onclick="closeImage();">&times;</span>
                    <img id="gallery-expanded-img" src="" alt="Expanded image">
                </div>
            </div>
        </main>
        <footer>
            <div id="site-info">
                Code4Projects, Copyright Salvatore D'Angelo &copy; 2016-2025.
            </div>
        </footer>
    </div>

</body>

</html>
